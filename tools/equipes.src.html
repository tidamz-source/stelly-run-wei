<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stelly Run · Résultats des équipes</title>
<meta name="theme-color" content="#2E0E30">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<style>
/*FONTS*/
:root{ --plum:#2E0E30; --plum2:#43184A; --yellow:#FFCF00; --yellow-l:#FFE777; --orange:#F29318; --purple:#7A57A0; --purple-l:#A58BC6; --white:#fff;
  --num:'Press Start 2P','Courier New',monospace; --txt:'Pixelify Sans',system-ui,sans-serif; }
*{ box-sizing:border-box; }
html,body{ margin:0; min-height:100%; background:var(--plum); color:#fff; font-family:var(--txt); font-weight:500; }
body{ background:repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 14px, transparent 0 28px), radial-gradient(ellipse at 50% -10%, #5A2260 0%, var(--plum) 60%) fixed; }
.wrap{ max-width:1180px; margin:0 auto; padding:max(16px, env(safe-area-inset-top)) 16px 32px; }
header{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
h1{ margin:0; font-weight:700; font-size:clamp(26px, 4.4vw, 46px); color:var(--yellow); letter-spacing:.02em;
  -webkit-text-stroke:4px var(--plum); paint-order:stroke fill; text-shadow:0 3px 0 var(--orange), 0 5px 0 #000; line-height:1.05; }
h1 small{ display:block; font-size:.42em; color:#fff; -webkit-text-stroke:0; text-shadow:none; opacity:.75; letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px; }
.btn{ font:inherit; font-weight:700; font-size:16px; cursor:pointer; text-decoration:none; color:var(--plum); background:var(--yellow); border:3px solid var(--plum); border-radius:6px;
  padding:8px 18px 10px; box-shadow:inset 0 -5px 0 var(--orange), inset 0 3px 0 var(--yellow-l), 0 5px 0 #000; display:inline-block; }
.nav{ display:flex; gap:10px; flex-wrap:wrap; }
.btn.alt{ background:#fff; box-shadow:inset 0 -5px 0 #CFC6DA, 0 5px 0 #000; }
.btn:active{ transform:translateY(4px); box-shadow:inset 0 -5px 0 var(--orange), 0 1px 0 #000; }
.rule{ margin:14px 0 18px; padding:10px 14px; border-radius:8px; background:rgba(255,255,255,.07); border:2px solid rgba(255,255,255,.12); font-size:15px; line-height:1.35; color:#EADCF2; }
.rule b{ color:var(--yellow); }
.grid{ display:grid; grid-template-columns:minmax(0, 1.7fr) minmax(0, 1fr); gap:20px; align-items:start; }
@media (max-width:820px){ .grid{ grid-template-columns:1fr; } }
.teams{ display:flex; flex-direction:column; gap:12px; }
.team{ position:relative; display:grid; grid-template-columns:auto 1fr auto; gap:6px 14px; align-items:center; padding:12px 16px 14px 12px; border-radius:10px;
  background:var(--plum2); border:3px solid #000; box-shadow:0 5px 0 #000; overflow:hidden; }
.team::before{ content:""; position:absolute; inset:0 auto 0 0; width:10px; background:var(--c); }
.team.first{ border-color:var(--yellow); box-shadow:0 5px 0 #000, 0 0 0 3px rgba(255,207,0,.25); }
.rk{ grid-column:1; grid-row:1 / span 4; width:54px; height:54px; margin-left:6px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--num); font-size:20px;
  color:var(--plum); background:var(--c); border:3px solid #000; box-shadow:inset 0 -5px 0 rgba(0,0,0,.25); }
.team.first .rk{ background:var(--yellow); }
.tname{ grid-column:2; grid-row:1; font-weight:700; font-size:clamp(20px, 2.6vw, 28px); color:#fff; display:flex; align-items:center; gap:10px; min-width:0; }
.tname i{ width:18px; height:18px; border-radius:4px; background:var(--c); border:2px solid #000; flex:none; }
.tscore{ grid-column:3; grid-row:1 / span 2; text-align:right; font-family:var(--num); font-size:clamp(18px, 2.6vw, 30px); color:var(--yellow); text-shadow:0 3px 0 #000; white-space:nowrap; }
.tscore em{ display:block; font-family:var(--txt); font-style:normal; font-weight:700; font-size:12px; color:var(--purple-l); text-shadow:none; margin-top:4px; letter-spacing:.04em; }
.bar{ grid-column:2; grid-row:2; height:12px; border-radius:6px; background:rgba(0,0,0,.35); overflow:hidden; }
.bar i{ display:block; height:100%; width:0; background:linear-gradient(var(--c), var(--c)); border-radius:6px; transition:width .9s cubic-bezier(.2,.8,.2,1); box-shadow:inset 0 -3px 0 rgba(0,0,0,.25); }
.meta{ grid-column:2 / span 2; grid-row:3; display:flex; flex-wrap:wrap; gap:6px 16px; font-size:14px; color:#D9C9E4; }
.meta b{ color:#fff; }
.tops{ grid-column:2 / span 2; grid-row:4; display:flex; flex-wrap:wrap; gap:6px; }
.tops span{ font-size:13px; padding:3px 8px; border-radius:5px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); color:#EADCF2; }
.tops span b{ font-family:var(--num); font-size:10px; color:var(--yellow); margin-left:6px; }
.team.empty{ opacity:.55; }
.team.empty .rk{ background:rgba(255,255,255,.15); color:#fff; }
.side h2{ margin:0 0 10px; font-size:22px; color:#fff; }
.top10{ display:flex; flex-direction:column; gap:6px; }
.row{ display:grid; grid-template-columns:34px 14px 1fr auto; gap:10px; align-items:center; padding:8px 12px; border-radius:8px; background:rgba(255,255,255,.06); border:2px solid transparent; font-size:16px; }
.row .n{ font-family:var(--num); font-size:12px; color:var(--purple-l); text-align:right; }
.row i{ width:14px; height:14px; border-radius:3px; background:var(--c); border:2px solid #000; }
.row .p{ font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .s{ font-family:var(--num); font-size:12px; color:var(--yellow); }
.row.r1 .n, .row.r2 .n, .row.r3 .n{ color:var(--yellow); }
.row.me{ border-color:var(--yellow); background:rgba(255,207,0,.12); }
.sep{ height:2px; margin:4px 10px; background:rgba(255,255,255,.12); }
.totals{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
.tile{ padding:10px 12px; border-radius:8px; background:rgba(255,255,255,.06); text-align:center; }
.tile b{ display:block; font-family:var(--num); font-size:16px; color:#fff; margin-bottom:6px; }
.tile span{ font-size:13px; color:var(--purple-l); }
footer{ margin-top:20px; text-align:center; font-size:13px; color:var(--purple-l); }
.msg{ padding:30px 16px; text-align:center; font-size:18px; color:#EADCF2; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><small>Stelly Run</small><span id="h1">Résultats des équipes</span></h1>
    <a class="btn" href="index.html" id="play">Jouer</a>
  </header>
  <p class="rule" id="rule"></p>
  <div class="grid">
    <section class="teams" id="teams"><div class="msg" id="load">…</div></section>
    <aside class="side"><h2 id="h2top">Top 10 des joueurs</h2><div class="top10" id="top10"></div><div class="totals" id="totals"></div></aside>
  </div>
  <footer id="foot"></footer>
</div>
<script>
'use strict';
const WEI_URL = /*URL*/'';
const COL = { bleu:'#3FA3E0', rouge:'#E8384F', jaune:'#FFCF00', vert:'#3DBE5A' };
const L = (() => { try { return localStorage.getItem('stellyrunwei_lang') || ''; } catch(e){ return ''; } })();
const LANG = ['fr', 'en', 'es'].includes(L) ? L : ((navigator.language || 'fr').slice(0, 2) === 'es' ? 'es' : ((navigator.language || 'fr').slice(0, 2) === 'en' ? 'en' : 'fr'));
const T = {
  fr:{ title:'Résultats des équipes', play:'Jouer', sts:'Stats', top:'Top 10 des joueurs', team:'Équipe {t}', t:{ bleu:'Bleue', rouge:'Rouge', jaune:'Jaune', vert:'Verte' },
    rule:'Pour que ce soit juste entre petites et grandes équipes, on compare la <b>moyenne des {n} meilleurs records</b> de chaque équipe (s’il y a moins de {n} joueurs, la moyenne de ceux qui ont joué).',
    rule0:'Le classement démarre dès la première partie jouée. On compare la <b>moyenne des meilleurs records</b> de chaque équipe, à nombre de joueurs égal.',
    avg:'moyenne top {k}', players:'{n} joueurs', player:'{n} joueur', games:'{n} parties', game:'{n} partie', points:'{n} pts au total', best:'Meilleur :', none:'Pas encore de joueur',
    tp:'joueurs', tg:'parties jouées', you:'toi', upd:'Mis à jour à {h} · actualisation automatique', off:'Résultats indisponibles pour le moment. Nouvel essai dans quelques secondes…', notset:'Le classement n’est pas encore branché.' },
  en:{ title:'Team results', play:'Play', sts:'Stats', top:'Top 10 players', team:'Team {t}', t:{ bleu:'Blue', rouge:'Red', jaune:'Yellow', vert:'Green' },
    rule:'To keep it fair between small and big teams, we compare the <b>average of the top {n} scores</b> of each team (with fewer than {n} players, the average of those who played).',
    rule0:'The ranking starts with the first run. We compare the <b>average of the best scores</b> of each team, with the same number of players.',
    avg:'top {k} average', players:'{n} players', player:'{n} player', games:'{n} runs', game:'{n} run', points:'{n} pts in total', best:'Best:', none:'No player yet',
    tp:'players', tg:'runs played', you:'you', upd:'Updated at {h} · auto refresh', off:'Results unavailable right now. Retrying in a few seconds…', notset:'The ranking is not connected yet.' },
  es:{ title:'Resultados de los equipos', play:'Jugar', sts:'Estadísticas', top:'Top 10 de jugadores', team:'Equipo {t}', t:{ bleu:'Azul', rouge:'Roja', jaune:'Amarilla', vert:'Verde' },
    rule:'Para que sea justo entre equipos pequeños y grandes, se compara la <b>media de los {n} mejores récords</b> de cada equipo (con menos de {n} jugadores, la media de los que han jugado).',
    rule0:'La clasificación empieza con la primera partida. Se compara la <b>media de los mejores récords</b> de cada equipo, con el mismo número de jugadores.',
    avg:'media top {k}', players:'{n} jugadores', player:'{n} jugador', games:'{n} partidas', game:'{n} partida', points:'{n} pts en total', best:'Mejor:', none:'Aún sin jugadores',
    tp:'jugadores', tg:'partidas jugadas', you:'tú', upd:'Actualizado a las {h} · actualización automática', off:'Resultados no disponibles por ahora. Nuevo intento en unos segundos…', notset:'La clasificación aún no está conectada.' }
}[LANG];
const f = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k]);
const N = n => Number(n || 0).toLocaleString({ fr:'fr-FR', en:'en-GB', es:'es-ES' }[LANG]).replace(/ | /g, ' ');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);
const $ = id => document.getElementById(id);
document.documentElement.lang = LANG; document.title = 'Stelly Run · ' + T.title; $('h1').textContent = T.title; $('play').textContent = T.play; $('h2top').textContent = T.top;
const myId = (() => { try { return localStorage.getItem('stellyrunwei_id') || ''; } catch(e){ return ''; } })();

function render(r){
  $('rule').innerHTML = r.N ? f(T.rule, { n: r.N }) : T.rule0;
  const max = Math.max(1, ...r.teams.map(t => t.score));
  $('teams').innerHTML = r.teams.map(t => {
    const c = COL[t.id] || '#888', name = f(T.team, { t: T.t[t.id] || t.id });
    if (!t.players) return '<div class="team empty" style="--c:' + c + '"><div class="rk">–</div><div class="tname"><i></i>' + esc(name) + '</div><div class="tscore">–</div><div class="meta">' + esc(T.none) + '</div></div>';
    return '<div class="team' + (t.rank === 1 ? ' first' : '') + '" style="--c:' + c + '">'
      + '<div class="rk">' + t.rank + '</div>'
      + '<div class="tname"><i></i>' + esc(name) + '</div>'
      + '<div class="tscore">' + N(t.score) + '<em>' + esc(f(T.avg, { k: Math.min(r.N, t.players) })) + '</em></div>'
      + '<div class="bar"><i data-w="' + (t.score/max*100).toFixed(1) + '"></i></div>'
      + '<div class="meta"><span><b>' + esc(f(t.players > 1 ? T.players : T.player, { n: N(t.players) })) + '</b></span><span>' + esc(f(t.games > 1 ? T.games : T.game, { n: N(t.games) })) + '</span><span>' + esc(f(T.points, { n: N(t.total) })) + '</span></div>'
      + '<div class="tops">' + t.top.map(p => '<span>' + esc(p.name) + '<b>' + N(p.score) + '</b></span>').join('') + '</div>'
      + '</div>';
  }).join('');
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.bar i').forEach(i => i.style.width = i.dataset.w + '%')));
  const row = p => '<div class="row' + (p.rank <= 3 ? ' r' + p.rank : '') + (p.me ? ' me' : '') + '" style="--c:' + (COL[p.team] || '#888') + '"><span class="n">' + p.rank + '</span><i></i><span class="p">' + esc(p.name) + (p.me ? ' (' + esc(T.you) + ')' : '') + '</span><span class="s">' + N(p.score) + '</span></div>';
  let h = r.top10.map(row).join('');
  if (r.me && r.me.rank > 10) h += '<div class="sep"></div>' + row(Object.assign({ me: true }, r.me));
  $('top10').innerHTML = h || '<div class="msg">' + esc(T.none) + '</div>';
  $('totals').innerHTML = '<div class="tile"><b>' + N(r.players) + '</b><span>' + esc(T.tp) + '</span></div><div class="tile"><b>' + N(r.games) + '</b><span>' + esc(T.tg) + '</span></div>';
  $('foot').textContent = f(T.upd, { h: new Date(r.at || Date.now()).toLocaleTimeString({ fr:'fr-FR', en:'en-GB', es:'es-ES' }[LANG], { hour:'2-digit', minute:'2-digit' }) });
}
let timer = 0;
async function load(){
  clearTimeout(timer);
  if (!WEI_URL){ $('teams').innerHTML = '<div class="msg">' + esc(T.notset) + '</div>'; return; }
  try { const r = await (await fetch(WEI_URL + '?id=' + encodeURIComponent(myId), { cache:'no-store' })).json(); if (!r || !r.teams) throw 0; render(r); timer = setTimeout(load, 30000); }
  catch(e){ if (!document.querySelector('.team')) $('teams').innerHTML = '<div class="msg">' + esc(T.off) + '</div>'; timer = setTimeout(load, 8000); }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
load();
</script>
</body>
</html>
