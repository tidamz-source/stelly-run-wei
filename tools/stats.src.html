<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stelly Run · Classement général</title>
<meta name="theme-color" content="#2E0E30">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<style>
/*FONTS*/
:root{ --plum:#2E0E30; --plum2:#43184A; --plum3:#5C3D63; --line:rgba(255,255,255,.12); --yellow:#FFCF00; --yellow-l:#FFE777; --orange:#F29318; --orange-d:#C9690E; --purple-l:#A58BC6;
  --cream:#FFF4D6; --cream-d:#EBD8A6; --grass:#4FAE4F; --grass-d:#3A8A3C; --num:'Press Start 2P','Courier New',monospace; --txt:'Pixelify Sans',system-ui,sans-serif; }
*{ box-sizing:border-box; }
html,body{ margin:0; background:var(--plum); color:#fff; font-family:var(--txt); font-weight:500; }
body{ background:repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 14px, transparent 0 28px), radial-gradient(ellipse at 50% -10%, #5A2260 0%, var(--plum) 60%) fixed; overflow-x:hidden; }
.wrap{ max-width:1180px; margin:0 auto; padding:max(16px, env(safe-area-inset-top)) 16px 40px; }
header{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
h1{ margin:0; font-weight:700; font-size:clamp(28px, 5vw, 52px); color:var(--yellow); -webkit-text-stroke:4px var(--plum); paint-order:stroke fill; text-shadow:0 3px 0 var(--orange), 0 6px 0 #000; line-height:1.05; }
h1 small{ display:block; font-size:.4em; color:#fff; -webkit-text-stroke:0; text-shadow:none; opacity:.75; letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px; }
.nav{ display:flex; gap:10px; flex-wrap:wrap; }
.btn{ font:inherit; font-weight:700; font-size:16px; cursor:pointer; text-decoration:none; color:var(--plum); background:var(--yellow); border:3px solid var(--plum); border-radius:6px;
  padding:8px 16px 10px; box-shadow:inset 0 -5px 0 var(--orange), inset 0 3px 0 var(--yellow-l), 0 5px 0 #000; display:inline-block; }
.btn.alt{ background:#fff; box-shadow:inset 0 -5px 0 #CFC6DA, 0 5px 0 #000; }
.btn:active{ transform:translateY(4px); }
.meta{ margin:10px 0 0; font-size:13px; color:var(--purple-l); }
h2{ margin:44px 0 16px; font-size:clamp(20px, 3vw, 28px); font-weight:700; display:flex; align-items:center; gap:10px; }
h2::before{ content:''; width:8px; height:24px; border-radius:2px; background:var(--yellow); box-shadow:0 3px 0 #000; }
h2 small{ font-size:14px; font-weight:500; color:var(--purple-l); margin-left:4px; }
.dot{ display:inline-block; width:12px; height:12px; border-radius:3px; border:2px solid #000; background:var(--c); flex:none; }

/* ---------- podium des équipes ---------- */
.stage{ position:relative; margin-top:18px; padding:26px 18px 0; border:3px solid #000; border-radius:12px; box-shadow:0 6px 0 #000; overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%, rgba(255,207,0,.18), transparent 55%), linear-gradient(#1F0A22, #3B1541 70%); }
.stage::before{ content:''; position:absolute; inset:0; pointer-events:none; opacity:.35;
  background-image:radial-gradient(#fff 1px, transparent 1.5px), radial-gradient(#fff 1px, transparent 1.5px); background-size:90px 70px, 130px 110px; background-position:10px 20px, 60px 40px; }
.pod{ position:relative; display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:14px; align-items:end; min-height:400px; }
.col{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; min-width:0; }
.crown{ font-size:34px; line-height:1; margin-bottom:4px; filter:drop-shadow(0 3px 0 #000); animation:bob 1.6s ease-in-out infinite; }
@keyframes bob{ 50%{ transform:translateY(-5px); } }
@media (prefers-reduced-motion: reduce){ .crown{ animation:none; } .pillar{ transition:none !important; } }
.tn{ font-weight:700; font-size:clamp(16px, 2.2vw, 24px); text-align:center; -webkit-text-stroke:3px #000; paint-order:stroke fill; color:#fff; }
.ts{ margin:6px 0 2px; font-family:var(--num); font-size:clamp(13px, 2vw, 22px); color:var(--yellow); text-shadow:0 3px 0 #000; white-space:nowrap; }
.gap{ font-size:13px; color:var(--purple-l); margin-bottom:10px; white-space:nowrap; }
.gap.lead{ color:var(--yellow-l); }
.pillar{ position:relative; width:100%; height:0; border:3px solid #000; border-bottom:0; border-radius:6px 6px 0 0; background:var(--c);
  box-shadow:inset 6px 0 0 rgba(255,255,255,.28), inset -8px 0 0 rgba(0,0,0,.22), inset 0 8px 0 rgba(255,255,255,.18); transition:height 1.1s cubic-bezier(.2,.9,.2,1); }
.pillar b{ position:absolute; top:10px; left:50%; transform:translateX(-50%); width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--num); font-size:18px; color:var(--plum); background:#fff; border:3px solid #000; box-shadow:inset 0 -5px 0 rgba(0,0,0,.18); }
.col.r1 .pillar b{ background:var(--yellow); }
.pillar ul{ list-style:none; margin:0; padding:68px 8px 10px; display:flex; flex-direction:column; gap:5px; }
.pillar li{ display:flex; justify-content:space-between; gap:6px; font-size:13px; font-weight:700; color:#000; background:rgba(255,255,255,.55); border-radius:4px; padding:3px 6px; min-width:0; }
.pillar li span{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pillar li em{ font-style:normal; font-family:var(--num); font-size:9px; align-self:center; white-space:nowrap; flex:none; }
.col.empty .pillar{ background:repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 8px, transparent 0 16px); }
.col.empty .tn, .col.empty .ts{ opacity:.55; }
.ground{ position:relative; height:26px; margin:0 -18px; background:var(--grass); border-top:3px solid #000; box-shadow:inset 0 5px 0 rgba(255,255,255,.2); }
.ground::after{ content:''; position:absolute; left:0; right:0; top:10px; height:3px; background:rgba(255,255,255,.7); }
.rule{ margin:12px 0 0; padding:10px 14px; border-radius:8px; background:rgba(255,255,255,.07); border:2px solid var(--line); font-size:15px; color:#EADCF2; }
.rule b{ color:var(--yellow); }
@media (max-width:700px){
  .pod{ grid-template-columns:repeat(2, minmax(0, 1fr)); min-height:0; row-gap:22px; }
  .pillar ul{ padding-top:64px; } .pillar li{ font-size:12px; } .pillar li em{ font-size:8px; }
}

/* ---------- course au titre et répartition ---------- */
.two{ display:grid; grid-template-columns:minmax(0, 1.25fr) minmax(0, 1fr); gap:18px; }
@media (max-width:860px){ .two{ grid-template-columns:1fr; } }
.panel{ background:var(--plum2); border:3px solid #000; border-radius:10px; padding:16px 18px 18px; box-shadow:0 5px 0 #000; }
.panel h3{ margin:0 0 4px; font-size:19px; font-weight:700; color:var(--yellow); }
.panel p.sub{ margin:0 0 14px; font-size:13px; color:var(--purple-l); }
.race{ display:flex; flex-direction:column; gap:12px; }
.lane{ display:grid; grid-template-columns:96px minmax(0, 1fr); gap:10px; align-items:center; }
.lane .ln{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; }
.track{ position:relative; height:30px; border-radius:6px; background:rgba(0,0,0,.35); border:2px solid #000; overflow:visible; }
.track::before{ content:''; position:absolute; inset:0; border-radius:4px; background:repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), rgba(255,255,255,.08) calc(10% - 2px) 10%); }
.fill{ position:absolute; left:0; top:0; bottom:0; width:0; border-radius:4px; background:var(--c); box-shadow:inset 0 -5px 0 rgba(0,0,0,.25), inset 0 4px 0 rgba(255,255,255,.25); transition:width 1.1s cubic-bezier(.2,.9,.2,1); }
.runner{ position:absolute; top:50%; transform:translate(-50%, -54%); left:0; width:30px; height:30px; transition:left 1.1s cubic-bezier(.2,.9,.2,1); image-rendering:pixelated; filter:drop-shadow(0 2px 0 #000); }
.lane .v{ grid-column:2; display:flex; justify-content:space-between; font-size:12px; color:var(--purple-l); margin-top:-4px; }
.lane .v b{ font-family:var(--num); font-size:10px; color:#fff; }
.share{ display:flex; flex-direction:column; gap:16px; }
.share .lab{ display:flex; justify-content:space-between; font-weight:700; font-size:15px; margin-bottom:6px; }
.share .lab em{ font-style:normal; font-family:var(--num); font-size:10px; color:var(--purple-l); align-self:center; }
.stack{ display:flex; height:34px; border:3px solid #000; border-radius:6px; overflow:hidden; background:rgba(0,0,0,.3); }
.stack i{ display:flex; align-items:center; justify-content:center; height:100%; background:var(--c); font-style:normal; font-family:var(--num); font-size:10px; color:#000; min-width:0; overflow:hidden;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.2), inset 0 4px 0 rgba(255,255,255,.25); border-right:2px solid #000; transition:flex-grow .9s; }
.stack i:last-child{ border-right:0; }
.legend{ display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:4px; font-size:13px; color:#EADCF2; }
.legend span{ display:flex; align-items:center; gap:6px; }

/* ---------- joueurs ---------- */
.ppod{ display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:14px; align-items:end; }
.pc{ position:relative; text-align:center; background:var(--cream); color:var(--plum); border:3px solid #000; border-radius:10px; box-shadow:0 5px 0 #000; padding:16px 10px 14px; border-top:10px solid var(--c); }
.pc.p1{ order:2; padding-top:26px; transform:translateY(-14px); } .pc.p2{ order:1; } .pc.p3{ order:3; }
.medal{ width:44px; height:44px; margin:0 auto 8px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--num); font-size:16px; border:3px solid #000; box-shadow:inset 0 -5px 0 rgba(0,0,0,.2); }
.p1 .medal{ background:var(--yellow); } .p2 .medal{ background:#D7DCE3; } .p3 .medal{ background:#D08A4E; }
.pc .nm{ font-weight:700; font-size:clamp(15px, 2vw, 20px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pc .tm{ display:flex; align-items:center; justify-content:center; gap:6px; font-size:13px; color:var(--plum3); margin:4px 0 8px; }
.pc .sc{ font-family:var(--num); font-size:clamp(12px, 1.8vw, 18px); color:var(--orange-d); }
.chips{ display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 12px; }
.chips button{ font:inherit; font-weight:700; font-size:15px; cursor:pointer; color:#fff; background:var(--plum2); border:2px solid var(--line); border-radius:999px; padding:6px 14px; display:flex; align-items:center; gap:8px; }
.chips button.on{ background:#fff; color:var(--plum); border-color:#fff; }
.chips .note{ align-self:center; font-size:13px; color:var(--purple-l); }
.rank{ display:flex; flex-direction:column; gap:6px; }
.row{ position:relative; display:grid; grid-template-columns:40px minmax(0, 1fr) auto; gap:12px; align-items:center; padding:9px 14px; border-radius:8px; background:rgba(255,255,255,.05); overflow:hidden; font-size:16px; }
.row .bar{ position:absolute; left:0; top:0; bottom:0; width:0; background:var(--c); opacity:.22; transition:width .9s cubic-bezier(.2,.9,.2,1); }
.row .bar::after{ content:''; position:absolute; right:0; top:0; bottom:0; width:4px; background:var(--c); opacity:1; }
.row > *:not(.bar){ position:relative; }
.row .n{ font-family:var(--num); font-size:12px; color:var(--purple-l); text-align:right; }
.row.r1 .n, .row.r2 .n, .row.r3 .n{ color:var(--yellow); }
.row .p{ display:flex; align-items:center; gap:10px; font-weight:700; min-width:0; }
.row .p span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .p em{ font-style:normal; font-weight:500; font-size:13px; color:var(--purple-l); white-space:nowrap; }
.row .s{ font-family:var(--num); font-size:12px; color:var(--yellow); }

/* ---------- détails ---------- */
.hero{ display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:12px; }
@media (max-width:700px){ .hero{ grid-template-columns:1fr 1fr; } }
.big{ background:var(--cream); color:var(--plum); border:3px solid #000; border-radius:10px; padding:14px 14px 12px; box-shadow:0 5px 0 #000; }
.big b{ display:block; font-family:var(--num); font-size:clamp(13px, 2vw, 20px); color:var(--orange-d); line-height:1.25; }
.big span{ display:block; margin-top:6px; font-weight:700; font-size:14px; color:var(--plum3); }
.duel{ overflow-x:auto; border-radius:10px; border:3px solid #000; box-shadow:0 5px 0 #000; background:var(--plum2); margin-top:14px; }
table{ border-collapse:collapse; width:100%; min-width:560px; }
th, td{ padding:9px 12px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
th:first-child, td:first-child{ text-align:left; position:sticky; left:0; background:var(--plum2); z-index:1; font-family:var(--txt); font-size:15px; font-weight:700; color:#EADCF2; }
thead th{ position:relative; font-size:16px; font-weight:700; color:#fff; padding-top:14px; border-bottom:3px solid #000; }
thead th.t::after{ content:''; position:absolute; left:0; right:0; top:0; height:6px; background:var(--c); }
td{ font-family:var(--num); font-size:11px; }
td.win{ color:var(--yellow); }
td.win .v::before{ content:'★ '; font-family:var(--txt); font-size:14px; }
td .b{ display:block; height:4px; margin-top:6px; margin-left:auto; border-radius:2px; background:var(--c); opacity:.8; }
tbody tr:last-child td{ border-bottom:0; }
.fame{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:14px; }
.fcard{ background:var(--plum2); border:3px solid #000; border-radius:10px; padding:14px 14px 10px; box-shadow:0 5px 0 #000; }
.fcard h3{ margin:0; font-size:18px; font-weight:700; color:var(--yellow); }
.fcard p{ margin:2px 0 10px; font-size:13px; color:var(--purple-l); }
.fcard ol{ list-style:none; margin:0; padding:0; }
.fcard li{ display:grid; grid-template-columns:20px 12px 1fr auto; align-items:center; gap:8px; padding:5px 6px; border-radius:6px; font-weight:700; font-size:14px; }
.fcard li:first-child{ background:rgba(255,207,0,.12); }
.fcard .rk{ font-family:var(--num); font-size:9px; color:var(--purple-l); text-align:right; }
.fcard li:first-child .rk{ color:var(--yellow); }
.fcard .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fcard .v{ font-family:var(--num); font-size:9px; color:var(--yellow-l); }
.empty, .msg{ color:var(--purple-l); font-size:16px; padding:8px 2px; }
.msg{ margin:70px auto; text-align:center; font-size:18px; }
footer{ margin-top:34px; text-align:center; font-size:13px; color:var(--purple-l); }
@media (max-width:600px){ .lane{ grid-template-columns:78px minmax(0, 1fr); } .row{ grid-template-columns:32px minmax(0, 1fr) auto; } .row .p em{ display:none; }
  .ppod{ gap:8px; } .pc{ padding:12px 6px 10px; } .medal{ width:36px; height:36px; font-size:13px; } }
</style>
</head>

  <main id="main"><p class="msg">…</p></main>

</div>
<script src="langues.js"></script>
<script>
(() => {
'use strict';
const WEI_URL = /*URL*/'';
const COL = { bleu:'#3FA3E0', rouge:'#E8384F', jaune:'#FFCF00', vert:'#3DBE5A' }, TEAMS = ['bleu', 'rouge', 'jaune', 'vert'];
const L = (() => { try { return localStorage.getItem('stellyrunwei_lang') || ''; } catch(e){ return ''; } })();
const LANG = LANGS[L] ? L : (LANGS[(navigator.language || 'fr').slice(0, 2)] ? (navigator.language || 'fr').slice(0, 2) : 'fr');
const PAGE = {

  split:{ fr:'Qui joue le plus ?', en:'Who plays the most?', es:'¿Quién juega más?' }, splitSub:{ fr:'part de chaque équipe', en:'share of each team', es:'parte de cada equipo' },

};
const FAME = [
  ['streak', { fr:'Mains d’or', en:'Golden Hands', es:'Manos de oro' }, { fr:'plus longue série de frisbees', en:'longest frisbee streak', es:'racha de frisbees más larga' }],
  ['discs', { fr:'Aspirateur à frisbees', en:'Frisbee Vacuum', es:'Aspiradora de frisbees' }, { fr:'frisbees attrapés', en:'frisbees caught', es:'frisbees atrapados' }],
  ['games', { fr:'Accro', en:'Hooked', es:'Enganchado' }, { fr:'parties jouées', en:'runs played', es:'partidas jugadas' }],
  ['dist', { fr:'Marathonien', en:'Marathon Runner', es:'Maratonista' }, { fr:'distance parcourue', en:'distance run', es:'distancia recorrida' }],
  ['ko', { fr:'Chasseur d’oiseaux', en:'Bird Hunter', es:'Cazador de pájaros' }, { fr:'oiseaux assommés', en:'birds knocked out', es:'pájaros noqueados' }],
  ['morts', { fr:'Cascadeur', en:'Stunt Double', es:'Doble de riesgo' }, { fr:'morts', en:'deaths', es:'muertes' }],
  ['rb', { fr:'Chasseur d’arc-en-ciel', en:'Rainbow Hunter', es:'Cazador de arcoíris' }, { fr:'frisbees arc-en-ciel', en:'rainbow frisbees', es:'frisbees arcoíris' }],

];
const DUEL = [['players', 'players'], ['games', 'stats.games'], ['discs', 'stats.discs'], ['dist', 'stats.dist'], ['time', 'time'], ['ko', 'stats.ko'], ['streak', 'streak'],
  ['rb', 'stats.rainbow'], ['combo', 'stats.combo'], ['superC', 'stats.superC'], ['mega', 'stats.mega'], ['giga', 'stats.giga'], ['fires', 'stats.fires'], ['socks', 'stats.socks'], ['missed', 'stats.missed'], ['morts', 'morts']];
const NO_AVG = ['players', 'streak'];
const pick = o => (o && (o[LANG] != null ? o[LANG] : o.fr)) || '';
const T = (k, v) => { let s = PAGE[k] ? pick(PAGE[k]) : (TEXTS[k] ? pick(TEXTS[k]) : k); if (v) for (const x in v) s = s.split('{' + x + '}').join(v[x]); return s; };
const tn = t => pick(PAGE.t)[t] || t;
const fmt = n => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, { fr:' ', es:'.' }[LANG] || ',');
const km = px => { const m = (px || 0)/30; return m >= 10000 ? (Math.round(m/100)/10).toLocaleString({ fr:'fr-FR', es:'es-ES' }[LANG] || 'en-US') + ' km' : fmt(m) + ' m'; };
const dur = sec => { const m = Math.floor((sec || 0)/60), h = Math.floor(m/60); return h >= 100 ? fmt(h) + ' h' : (h ? h + ' h ' + String(m % 60).padStart(2, '0') : m + ' min'); };
const val = (k, v) => k === 'dist' ? km(v) : (k === 'time' ? dur(v) : (v > 0 && v < 10 && v % 1 ? v.toFixed(1).replace('.', LANG === 'en' ? '.' : ',') : fmt(v)));
const esc = v => String(v).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);
const $ = id => document.getElementById(id);
// petit Stelly en pixels pour la course au titre (étoile jaune à pattes)
const STAR = (() => { const c = document.createElement('canvas'); c.width = 15; c.height = 15; const g = c.getContext('2d');
  const m = ['.......o.......', '......oyo......', '.....oyyyo.....', 'ooooooyyyoooooo', 'oyyyyyyyyyyyyyo', '.oyywyywyyyyyo.', '..oywoywoyyyo..', '...oyyyyyyyo...', '...oyyyyyyyo...',
    '..oyyyooyyyyo..', '..oyyo..oyyyo..', '.oyo.....oyyo..', '.oo.......oo...', '.o.........o...', 'oo........oo...'];
  const P = { o:'#2E0E30', y:'#FFCF00', w:'#FFFFFF' }; m.forEach((r, y) => [...r].forEach((ch, x) => { if (P[ch]){ g.fillStyle = P[ch]; g.fillRect(x, y, 1, 1); } })); return c.toDataURL(); })();

let res = null, st = null, filter = '', per = true, ok = true;
// classement des équipes : moyenne des 3 meilleurs records (ou de ceux qui ont joué)
function standings(){
  const t = (res.teams || []).map(x => { const top = (x.top || []).slice().sort((a, b) => b.score - a.score).slice(0, 3);
    return Object.assign({}, x, { top, score: top.length ? Math.round(top.reduce((s, p) => s + p.score, 0) / top.length) : 0 }); });
  TEAMS.forEach(id => { if (!t.find(x => x.id === id)) t.push({ id, players:0, score:0, games:0, total:0, top:[] }); });
  t.sort((a, b) => b.score - a.score || b.players - a.players);
  t.forEach(x => x.rank = x.players ? 1 + t.filter(y => y.players && y.score > x.score).length : 0);
  return t;
}
function podium(t){
  const max = Math.max(1, ...t.map(x => x.score)), lead = t[0] && t[0].score;
  const order = matchMedia('(max-width:700px)').matches ? t : [t[1], t[0], t[2], t[3]];
  return '<div class="stage"><div class="pod">' + order.map(x => {
    const narrow = matchMedia('(max-width:700px)').matches, h = x.players ? (narrow ? 170 + Math.round(60 * x.score / max) : 150 + Math.round(170 * x.score / max)) : (narrow ? 150 : 120), first = x.rank === 1;
    return '<div class="col' + (first ? ' r1' : '') + (x.players ? '' : ' empty') + '" style="--c:' + COL[x.id] + '">'
      + (first ? '<div class="crown">👑</div>' : '')
      + '<div class="tn">' + esc(T('team', { t: tn(x.id) })) + '</div>'
      + '<div class="ts">' + (x.players ? fmt(x.score) : '–') + '</div>'
      + '<div class="gap' + (first ? ' lead' : '') + '">' + esc(!x.players ? T('none') : (first ? T('lead') : T('behind', { n: fmt(lead - x.score) }))) + '</div>'
      + '<div class="pillar" data-h="' + h + '"><b>' + (x.rank || '–') + '</b><ul>' + x.top.map(p => '<li><span>' + esc(p.name) + '</span><em>' + fmt(p.score) + '</em></li>').join('') + '</ul></div></div>';
  }).join('') + '</div><div class="ground"></div></div><p class="rule">' + T('rule') + '</p>';
}
function race(t){
  const max = Math.max(1, ...t.map(x => x.score));
  return '<div class="panel"><h3>' + esc(T('race')) + '</h3><p class="sub">' + esc(T('raceSub')) + '</p><div class="race">' + t.map(x => {
    const w = (x.score / max * 100).toFixed(1);
    return '<div class="lane" style="--c:' + COL[x.id] + '"><span class="ln"><span class="dot"></span>' + esc(tn(x.id)) + '</span>'
      + '<div class="track"><div class="fill" data-w="' + w + '"></div><img class="runner" alt="" src="' + STAR + '" data-w="' + w + '"></div>'
      + '<div class="v"><span>' + esc(T(x.games > 1 ? 'games' : 'game', { n: fmt(x.games) })) + '</span><b>' + fmt(x.score) + '</b></div></div>';
  }).join('') + '</div></div>';
}
function split(t){
  const bar = (k, lab, f) => { const tot = TEAMS.reduce((s, id) => s + (+(t.find(x => x.id === id) || {})[k] || 0), 0);
    return '<div><div class="lab"><span>' + esc(T(lab)) + '</span><em>' + (f ? f(tot) : fmt(tot)) + '</em></div><div class="stack">' + (tot ? TEAMS.map(id => { const v = +(t.find(x => x.id === id) || {})[k] || 0;
      return v ? '<i style="--c:' + COL[id] + '; flex-grow:' + v + '">' + Math.round(v / tot * 100) + '%</i>' : ''; }).join('') : '') + '</div></div>'; };
  return '<div class="panel"><h3>' + esc(T('split')) + '</h3><p class="sub">' + esc(T('splitSub')) + '</p><div class="share">'
    + bar('players', 'sPlayers') + bar('games', 'sGames') + bar('total', 'sPts')
    + '<div class="legend">' + TEAMS.map(id => '<span style="--c:' + COL[id] + '"><span class="dot"></span>' + esc(tn(id)) + '</span>').join('') + '</div></div></div>';
}
function rankList(list){
  const l = list.filter(p => !filter || p.team === filter), mx = Math.max(1, ...list.map(p => p.score));
  if (!l.length) return '<div class="empty">' + esc(T('nobody')) + '</div>';
  return l.map(p => '<div class="row' + (p.rank <= 3 ? ' r' + p.rank : '') + '" style="--c:' + COL[p.team] + '"><span class="bar" data-w="' + (p.score / mx * 100).toFixed(1) + '"></span><span class="n">' + p.rank + '</span>'
    + '<span class="p"><span class="dot"></span><span>' + esc(p.name) + '</span><em>' + esc(T(p.games > 1 ? 'games' : 'game', { n: fmt(p.games) })) + '</em></span><span class="s">' + fmt(p.score) + '</span></div>').join('');
}
function players(list){
  const top = list.slice(0, 3);
  return '<div class="ppod">' + top.map((p, i) => '<div class="pc p' + (i + 1) + '" style="--c:' + COL[p.team] + '"><div class="medal">' + (i + 1) + '</div><div class="nm">' + esc(p.name) + '</div>'
    + '<div class="tm"><span class="dot"></span>' + esc(T('team', { t: tn(p.team) })) + '</div><div class="sc">' + fmt(p.score) + '</div></div>').join('') + '</div>'
    + '<div class="chips" id="pf"><button data-f=""' + (filter ? '' : ' class="on"') + '>' + esc(T('all')) + '</button>'
    + TEAMS.map(x => '<button data-f="' + x + '" style="--c:' + COL[x] + '"' + (filter === x ? ' class="on"' : '') + '><span class="dot"></span>' + esc(tn(x)) + '</button>').join('') + '</div>'
    + '<div class="rank" id="rank">' + rankList(list) + '</div>';
}
function details(t){
  if (!st || !st.ok) return '';
  const tot = st.totals || {};
  let h = '<h2>' + esc(T('details')) + '</h2><section class="hero">'
    + '<div class="big"><b>' + fmt(res.games) + '</b><span>' + esc(T('stats.games')) + '</span></div>'
    + '<div class="big"><b>' + fmt(tot.discs) + '</b><span>' + esc(T('stats.discs')) + '</span></div>'
    + '<div class="big"><b>' + km(tot.dist) + '</b><span>' + esc(T('stats.dist')) + '</span></div>'
    + '<div class="big"><b>' + dur(tot.time) + '</b><span>' + esc(T('time')) + '</span></div></section>';
  const teams = {}; TEAMS.forEach(id => { const s = (st.teams || {})[id] || {}, r = t.find(x => x.id === id) || {}; teams[id] = Object.assign({}, s, { sp: s.players || 0, players: r.players || 0, games: r.games || 0 }); });
  h += '<h2>' + esc(T('duel')) + '</h2><div class="chips mode"><button data-m="1"' + (per ? ' class="on"' : '') + '>' + esc(T('per')) + '</button><button data-m="0"' + (per ? '' : ' class="on"') + '>' + esc(T('tot')) + '</button>'
    + (per ? '<span class="note">' + esc(T('perNote')) + '</span>' : '') + '</div><div class="duel"><table><thead><tr><th></th>'
    + TEAMS.map(x => '<th class="t" style="--c:' + COL[x] + '"><span class="dot"></span> ' + esc(tn(x)) + '</th>').join('') + '</tr></thead><tbody>';
  for (const [k, lab] of DUEL){
    const vs = TEAMS.map(x => { const o = teams[x], v = +o[k] || 0, n = k === 'games' ? o.players : o.sp; return per && !NO_AVG.includes(k) ? (n ? v / n : 0) : v; }), mx = Math.max(...vs);
    h += '<tr><td>' + esc(T(lab)) + '</td>' + TEAMS.map((x, i) => '<td class="' + (mx > 0 && vs[i] === mx && k !== 'missed' && k !== 'morts' ? 'win' : '') + '" style="--c:' + COL[x] + '"><span class="v">'
      + (k === 'streak' ? 'x' : '') + val(k, vs[i]) + '</span><span class="b" style="width:' + (mx ? Math.max(4, vs[i] / mx * 100) : 0) + '%"></span></td>').join('') + '</tr>';
  }
  h += '</tbody></table></div>';
  if (TEAMS.some(x => teams[x].sp < teams[x].players)) h += '<p class="meta">' + esc(T('later')) + '</p>';
  h += '<h2>' + esc(T('fame')) + '</h2><section class="fame">' + FAME.map(([k, title, what]) => {
    const list = (st.leaders || {})[k] || [];
    return '<div class="fcard"><h3>' + esc(pick(title)) + '</h3><p>' + esc(pick(what)) + '</p>' + (list.length ? '<ol>' + list.map((p, i) => '<li style="--c:' + COL[p.team] + '"><span class="rk">' + (i + 1)
      + '</span><span class="dot"></span><span class="nm">' + esc(p.name) + '</span><span class="v">' + (k === 'streak' ? 'x' : '') + val(k, p.v) + '</span></li>').join('') + '</ol>' : '<div class="empty">' + esc(T('nobody')) + '</div>') + '</div>';
  }).join('') + '</section>';
  return h;
}
function grow(){ requestAnimationFrame(() => requestAnimationFrame(() => {
  document.querySelectorAll('.pillar').forEach(p => p.style.height = p.dataset.h + 'px');
  document.querySelectorAll('.fill, .row .bar').forEach(f => f.style.width = f.dataset.w + '%');
  document.querySelectorAll('.runner').forEach(r => r.style.left = 'clamp(15px, ' + r.dataset.w + '%, calc(100% - 15px))'); })); }
function render(){
  document.documentElement.lang = LANG; document.title = 'Stelly Run · ' + T('title');
  $('h1').textContent = T('title'); $('res').textContent = T('res'); $('play').textContent = T('play');
  const main = $('main');
  if (!WEI_URL){ main.innerHTML = '<p class="msg">' + esc(T('notset')) + '</p>'; return; }
  if (!res){ main.innerHTML = '<p class="msg">' + (ok ? '…' : esc(T('error'))) + '</p>'; return; }
  $('meta').textContent = T('meta', { n: fmt(res.players), g: fmt(res.games), t: new Date(res.at || Date.now()).toLocaleTimeString({ fr:'fr-FR', es:'es-ES' }[LANG] || 'en-GB', { hour:'2-digit', minute:'2-digit' }) });
  if (!res.players){ main.innerHTML = '<p class="msg">' + esc(T('empty')) + '</p>'; return; }
  const t = standings();
  const list = st && st.ok && st.ranking ? st.ranking : (res.top10 || []).map(p => Object.assign({ games: 0 }, p));
  main.innerHTML = '<h2>' + esc(T('podium')) + '</h2>' + podium(t)
    + '<div class="two" style="margin-top:22px">' + race(t) + split(t) + '</div>'
    + '<h2>' + esc(T('pRank')) + '<small>' + esc(T('pSub')) + '</small></h2>' + players(list)
    + details(t);
  main.dataset.list = '1'; window.__list = list;
  grow();
}
document.addEventListener('click', e => {
  const m = e.target.closest('.mode button'); if (m){ per = m.dataset.m === '1'; const y = scrollY; render(); scrollTo(0, y); return; }
  const b = e.target.closest('#pf button'); if (!b) return; filter = b.dataset.f;
  document.querySelectorAll('#pf button').forEach(x => x.classList.toggle('on', x === b)); $('rank').innerHTML = rankList(window.__list || []); grow(); });
let timer = 0, wasNarrow = matchMedia('(max-width:700px)').matches;
addEventListener('resize', () => { const n = matchMedia('(max-width:700px)').matches; if (n !== wasNarrow){ wasNarrow = n; render(); } });
async function load(){
  clearTimeout(timer); if (!WEI_URL){ render(); return; }
  try {
    const [q, r] = await Promise.all([fetch(WEI_URL, { cache:'no-store' }).then(x => x.json()), fetch(WEI_URL + '?view=stats', { cache:'no-store' }).then(x => x.json()).catch(() => null)]);
    if (!q || !q.teams) throw 0; res = q; st = r; ok = true; timer = setTimeout(load, 45000);
  } catch(e){ ok = false; timer = setTimeout(load, 10000); }
  const y = scrollY; render(); scrollTo(0, y);
}
render(); load();
})();
</script>
</body>
